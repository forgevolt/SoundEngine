sentence=Play short WAV sound effects on an ESP32 through an I2S DAC.
paragraph=Mixes any number of 16-bit PCM clips embedded in flash and streams them to an I2S amplifier from its own background task, so playback never blocks the sketch. Clips carry their own volume and can repeat; a master gain sits on top. Three sounds are built in and three more ship ready to include.
